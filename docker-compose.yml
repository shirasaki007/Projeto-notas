services:
  db:
    image: postgres:17
    container_name: notas-db
    environment:
      POSTGRES_USER: notas
      POSTGRES_PASSWORD: notas_dev_pw
      POSTGRES_DB: notas
    ports:
      - "5432:5432"
    volumes:
      - notas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notas -d notas"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  notas-pgdata:
